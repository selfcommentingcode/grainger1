# Test-only datasource: in-memory H2 in PostgreSQL-compatibility mode.
# Keeps the test suite hermetic — no Docker, no running Postgres required.
# schema.sql (PostgreSQL-compatible DDL) still runs on startup to create the table.
spring.datasource.url=jdbc:h2:mem:productsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
