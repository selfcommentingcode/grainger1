spring.application.name=products

# --- Database: native PostgreSQL ---
# Override user/password with env vars DB_USER / DB_PASSWORD if yours differ.
spring.datasource.url=jdbc:postgresql://localhost:5432/productsdb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Create the `products` table from schema.sql on startup (idempotent).
# We manage the schema with SQL, so Hibernate does not touch it.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
